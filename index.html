
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<title>Lookpub</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai&display=swap" rel="stylesheet" />

<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

<style>
body {
 font-family: 'Noto Sans Thai', sans-serif;
 margin: 0;
 background: #f5f5f5;
}

header {
 text-align: center;
 padding: 20px;
 background: black;
 color: white;
}

.ar-section {
 background: white;
 margin: 20px;
 padding: 15px;
 border-radius: 12px;
}

.head-title {
 font-size: 20px;
 font-weight: bold;
}

.ar-button {
 margin-top: 10px;
 padding: 10px 15px;
 border: none;
 background: black;
 color: white;
 border-radius: 8px;
 cursor: pointer;
}
</style>
</head>

<body>

<header>
<h1>Lookpub</h1>
<p>AR</p>
</header>

<div class="ar-section">
<div class="head-title">hello</div>

<model-viewer
   src="https://modelviewer.dev/shared-assets/models/Astronaut.glb"
   ar
   camera-controls
   auto-rotate
   style="width:100%; height:400px;">
</model-viewer>

</div>

</body>
</html>
