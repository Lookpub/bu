<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<title>Lookpub</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />

<!-- ต้องโหลดก่อนใช้งาน -->
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

<style>
  body { font-family: "Noto Sans Thai", sans-serif; }
</style>
</head>

<body>

<header>
  <div class="main-title">Lookpub</div>
  <div class="sub-title">AR</div>
</header>

<!-- ===== MODEL 1 ===== -->
<div class="ar-section">
  <div class="head-title">hello</div>
  <div class="sub-title">hello</div>

  <model-viewer
    id="model1"
    src="hello.glb"
    ios-src="hello.usdz"
    ar
    ar-modes="scene-viewer webxr quick-look"
    camera-controls
    autoplay
    auto-rotate
    shadow-intensity="1"
    shadow-softness="1"
    environment-image="neutral"
    loading="lazy"
    style="width:100%; height:400px;">
  </model-viewer>

  <button class="ar-button" onclick="triggerAR('model1')">Play AR</button>
</div>

<!-- ===== MODEL 2 (แก้ชื่อไฟล์ไทย) ===== -->
<div class="ar-section">
  <div class="head-title">บ้านลูกแพร</div>
  <div class="sub-title">The design concept from my name, Prae</div>

  <model-viewer
    id="model2"
    src="https://your-server/%E0%B8%9A%E0%B9%89%E0%B8%B2%E0%B8%99%E0%B8%A5%E0%B8%B9%E0%B8%81%E0%B9%81%E0%B8%9E%E0%B8%A3.glb"
    ios-src="https://your-server/%E0%B8%9A%E0%B9%89%E0%B8%B2%E0%B8%99%E0%B8%A5%E0%B8%B9%E0%B8%81%E0%B9%81%E0%B8%9E%E0%B8%A3.usdz"
    ar
    ar-modes="scene-viewer webxr quick-look"
    camera-controls
    autoplay
    auto-rotate
    shadow-intensity="1"
    shadow-softness="1"
    environment-image="neutral"
    loading="lazy"
    style="width:100%; height:400px;">
  </model-viewer>

  <button class="ar-button" onclick="triggerAR('model2')">Play AR</button>
</div>

<!-- ===== MODEL 3 ===== -->
<div class="ar-section">
  <div class="head-title">character</div>
  <div class="sub-title">The design concept is fun character</div>

  <model-viewer
    id="model3"
    src="character.glb"
    ios-src="character.usdz"
    ar
    ar-modes="scene-viewer webxr quick-look"
    camera-controls
    autoplay
    auto-rotate
    shadow-intensity="1"
    shadow-softness="1"
    environment-image="neutral"
    loading="lazy"
    style="width:100%; height:400px;">
  </model-viewer>

  <button class="ar-button" onclick="triggerAR('model3')">Play AR</button>
</div>

<footer>
  <div>
    <strong>Instagram:</strong>
    <a href="https://surl.li/rgbbqy" target="_blank">instagram.com/p3lth_</a>
  </div>
</footer>

<script>
async function triggerAR(id) {
  const viewer = document.getElementById(id);

  if (!viewer) return;

  try {
    await viewer.activateAR();
  } catch (err) {
    console.warn(err);
    alert("AR ใช้งานไม่ได้บนอุปกรณ์นี้ หรือ browser ไม่รองรับ\nลองกดปุ่ม AR บนมุมโมเดลแทน");
  }
}
</script>

</body>
</html>
