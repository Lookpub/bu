<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<title>Lookpub</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai&display=swap" rel="stylesheet" />

<style>
body {
  font-family: 'Noto Sans Thai', sans-serif;
  margin: 0;
  background: #f5f5f5;
}

header {
  text-align: center;
  padding: 20px;
  background: black;
  color: white;
}

.main-title {
  font-size: 28px;
}

.sub-title {
  font-size: 14px;
  opacity: 0.7;
}

.ar-section {
  background: white;
  margin: 20px;
  padding: 15px;
  border-radius: 12px;
}

.head-title {
  font-size: 20px;
  font-weight: bold;
}

.ar-button {
  margin-top: 10px;
  padding: 10px 15px;
  border: none;
  background: black;
  color: white;
  border-radius: 8px;
  cursor: pointer;
}

.ar-button:hover {
  background: #333;
}

footer {
  text-align: center;
  padding: 20px;
}
</style>

</head>

<body>

<header>
  <div class="main-title">Lookpub</div>
  <div class="sub-title">AR</div>
</header>

<!-- hello -->
<div class="ar-section">
  <div class="head-title">hello</div>
  <div class="sub-title">hello</div>

  <model-viewer id="model1"
       src="hello.glb"
       ios-src="hello.usdz"
       ar
       ar-modes="scene-viewer webxr quick-look"
       camera-controls
       auto-rotate
       shadow-intensity="1"
       environment-image="neutral.hdr"
       style="width: 100%; height: 400px;">
  </model-viewer>

  <button class="ar-button" onclick="triggerAR('model1')">Play AR</button>
</div>

<!-- บ้านลูกแพร -->
<div class="ar-section">
  <div class="head-title">บ้านลูกแพร</div>
  <div class="sub-title">The design concept from my name, Prae</div>

  <model-viewer id="model2"
       src="baan-luk-prae.glb"
       ios-src="baan-luk-prae.usdz"
       ar
       ar-modes="scene-viewer webxr quick-look"
       camera-controls
       auto-rotate
       shadow-intensity="1"
       environment-image="neutral.hdr"
       style="width: 100%; height: 400px;">
  </model-viewer>

  <button class="ar-button" onclick="triggerAR('model2')">Play AR</button>
</div>

<!-- character -->
<div class="ar-section">
  <div class="head-title">character</div>
  <div class="sub-title">The design concept is fun character</div>

  <model-viewer id="model3"
       src="character.glb"
       ios-src="character.usdz"
       ar
       ar-modes="scene-viewer webxr quick-look"
       camera-controls
       auto-rotate
       shadow-intensity="1"
       environment-image="neutral.hdr"
       style="width: 100%; height: 400px;">
  </model-viewer>

  <button class="ar-button" onclick="triggerAR('model3')">Play AR</button>
</div>

<footer>
  <div><strong>Instagram:</strong> 
    <a href="https://surl.li/rgbbqy" target="_blank">instagram.com/p3lth_</a>
  </div>
</footer>

<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

<script>
function triggerAR(id) {
  const viewer = document.getElementById(id);
  if (viewer && viewer.activateAR) {
    viewer.activateAR().catch((error) => {
      alert("AR ใช้ไม่ได้บนอุปกรณ์นี้");
      console.warn(error);
    });
  }
}
</script>

</body>
</html>
